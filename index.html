<script>
'use strict';
// ================= AUDIO =================
const AU={ctx:null,master:null,music:null,sfx:null,musicOn:true,seqT:0,step:0,timer:null};
function auInit(){
 if(AU.ctx) { if(AU.ctx.state==='suspended') AU.ctx.resume(); return; }
 try{ AU.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
 const c=AU.ctx; AU.master=c.createGain(); AU.master.gain.value=0.8; AU.master.connect(c.destination);
 AU.sfx=c.createGain(); AU.sfx.gain.value=0.9; AU.sfx.connect(AU.master);
 AU.music=c.createGain(); AU.music.gain.value=AU.musicOn?0.32:0; AU.music.connect(AU.master);
 const len=c.sampleRate*1; AU.noise=c.createBuffer(1,len,c.sampleRate); const d=AU.noise.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
 AU.nextT=c.currentTime+0.1; AU.timer=setInterval(musicTick,50);
}
function tone(f,dur,type,vol,slide,delay,dest){
 if(!AU.ctx) return; const c=AU.ctx,t=c.currentTime+(delay||0);
 const o=c.createOscillator(),g=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
 if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);
 g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 o.connect(g); g.connect(dest||AU.sfx); o.start(t); o.stop(t+dur+0.05);
}
function noise(dur,vol,fc,delay,type,dest,fend){
 if(!AU.ctx) return; const c=AU.ctx,t=c.currentTime+(delay||0);
 const s=c.createBufferSource(); s.buffer=AU.noise; const f=c.createBiquadFilter(); f.type=type||'lowpass'; f.frequency.setValueAtTime(fc||1200,t);
 if(fend) f.frequency.exponentialRampToValueAtTime(fend,t+dur);
 const g=c.createGain(); g.gain.setValueAtTime(vol||0.3,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 s.connect(f); f.connect(g); g.connect(dest||AU.sfx); s.start(t); s.stop(t+dur+0.05);
}
const SFX={
 kick(){ tone(180,0.12,'sine',0.5,60); noise(0.05,0.25,2500); },
 bounce(v){ tone(120+Math.min(v,1)*80,0.08,'sine',0.18*Math.min(1,v+0.2),70); },
 jump(){ tone(300,0.12,'square',0.06,620); },
 coin(){ tone(988,0.08,'square',0.12); tone(1319,0.25,'square',0.12,null,0.07); },
 goal(){ [523,659,784,1046].forEach((f,i)=>tone(f,0.35,'sawtooth',0.12,null,i*0.09)); noise(1.6,0.25,900,0,'bandpass',null,500); noise(1.2,0.12,3000,0.1,'highpass'); },
 whistle(){ tone(2200,0.25,'sine',0.15); tone(2200,0.4,'sine',0.15,null,0.3); },
 ability(){ tone(400,0.25,'sawtooth',0.12,1200); noise(0.25,0.12,4000,0,'highpass'); },
 boom(){ noise(0.8,0.6,700,0,'lowpass',null,80); tone(90,0.6,'sine',0.5,30); },
 clang(){ tone(700,0.6,'square',0.12,690); tone(1050,0.5,'square',0.08,1040); noise(0.15,0.3,5000,0,'highpass'); },
 zap(){ for(let i=0;i<5;i++) tone(1500-Math.random()*900,0.06,'sawtooth',0.12,200,i*0.04); noise(0.3,0.3,6000,0,'highpass'); },
 freeze(){ tone(2000,0.5,'sine',0.1,4000); tone(1500,0.4,'triangle',0.1,3000,0.05); },
 whoosh(){ noise(0.35,0.3,400,0,'bandpass',null,3000); },
 pop(){ tone(600,0.08,'sine',0.25,1400); },
 impact(){ tone(60,0.5,'sine',0.7,30); noise(0.4,0.6,1500,0,'lowpass',null,100); tone(1800,0.15,'square',0.08,300); },
 timestop(){ tone(1200,1.2,'sine',0.25,80); noise(1.2,0.2,2000,0,'bandpass',null,200); },
 snore(){ tone(110,0.6,'sawtooth',0.06,90); },
 paint(){ noise(0.25,0.3,800,0,'lowpass',null,200); tone(250,0.15,'sine',0.2,120); },
 math(){ [660,880,990].forEach((f,i)=>tone(f,0.12,'triangle',0.13,null,i*0.06)); },
 buzz(){ tone(150,0.3,'square',0.1,140); },
 guitar(){ if(!AU.ctx) return; const c=AU.ctx; const ws=c.createWaveShaper(); const n=1024, cur=new Float32Array(n); for(let i=0;i<n;i++){ const x=i/n*2-1; cur[i]=Math.tanh(x*12); } ws.curve=cur; const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3200; const g=c.createGain(); g.gain.value=0.16; ws.connect(lp); lp.connect(g); g.connect(AU.sfx);
  const riff=[[82.4,0],[82.4,0.12],[98,0.24],[110,0.36],[82.4,0.5],[123.5,0.62],[110,0.74],[164.8,0.9]];
  riff.forEach(([f,d],i)=>{ const t=c.currentTime+d, dur=i===riff.length-1?0.9:0.14; [1,1.498,2].forEach(m=>{ const o=c.createOscillator(), e=c.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(f*m,t); if(i===riff.length-1) o.frequency.linearRampToValueAtTime(f*m*1.03,t+dur); e.gain.setValueAtTime(0.0001,t); e.gain.exponentialRampToValueAtTime(0.5,t+0.01); e.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(e); e.connect(ws); o.start(t); o.stop(t+dur+0.05); }); });
  noise(0.08,0.2,6000,0,'highpass'); },
 bell(){ [880,1320,1760,2640].forEach((f,i)=>tone(f,2.2-i*0.3,'sine',0.18/(i+1))); tone(440,2.4,'triangle',0.12); [0.5,1.0].forEach(d=>{ [880,1320,1760].forEach((f,i)=>tone(f,1.4,'sine',0.12/(i+1),null,d)); }); },
 calm(){ [523,659,784,1046].forEach((f,i)=>tone(f,0.9,'sine',0.12,null,i*0.12)); },
 countdown(hi){ tone(hi?1046:523,hi?0.5:0.18,'square',0.1); },
 hole(){ tone(200,1.4,'sawtooth',0.12,40); noise(1.4,0.2,300,0,'lowpass',null,60); },
 cheer(){ noise(2.2,0.18,1200,0,'bandpass',null,700); },
};
// ---- music: upbeat loop (original) ----
const MUS={bpm:124,
 prog:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]], // Am F C G
 lead:[76,0,74,72,0,72,74,76, 77,0,76,74,0,72,69,0, 72,0,74,76,0,79,76,74, 74,0,72,71,0,67,71,74]
};
function mf(n){ return 440*Math.pow(2,(n-69)/12); }
function musicTick(){
 const c=AU.ctx; if(!c) return; const sp=60/MUS.bpm/4;
 while(AU.nextT<c.currentTime+0.2){
  const s=AU.step, t=AU.nextT, bar=Math.floor(s/16)%4, ch=MUS.prog[bar], st=s%16;
  const play=(f,d,type,v,when)=>{ const o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0.0001,when); g.gain.exponentialRampToValueAtTime(v,when+0.01); g.gain.exponentialRampToValueAtTime(0.0001,when+d); o.connect(g); g.connect(AU.music); o.start(when); o.stop(when+d+0.05); };
  if(st%4===0){ // kick
   const o=c.createOscillator(),g=c.createGain(); o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(40,t+0.12); g.gain.setValueAtTime(0.7,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15); o.connect(g); g.connect(AU.music); o.start(t); o.stop(t+0.2);
  }
  if(st===4||st===12){ const sN=c.createBufferSource(); sN.buffer=AU.noise; const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=1500; const g=c.createGain(); g.gain.setValueAtTime(0.35,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.14); sN.connect(f); f.connect(g); g.connect(AU.music); sN.start(t); sN.stop(t+0.2); }
  if(st%2===1){ const sN=c.createBufferSource(); sN.buffer=AU.noise; const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=8000; const g=c.createGain(); g.gain.setValueAtTime(0.12,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.04); sN.connect(f); f.connect(g); g.connect(AU.music); sN.start(t); sN.stop(t+0.06); }
  if(st%2===0) play(mf(ch[0]-24+(st%4===2?12:0)),sp*1.8,'square',0.13,t);
  if(st===0||st===6||st===10) ch.forEach(n=>play(mf(n),sp*3,'triangle',0.06,t));
  const ln=MUS.lead[(Math.floor(s/2))%32]; if(s%2===0&&ln&&Math.floor(s/64)%2===1) play(mf(ln),sp*1.9,'square',0.05,t);
  AU.step++; AU.nextT+=sp;
 }
}
function setMusic(on){ AU.musicOn=on; if(AU.music) AU.music.gain.setTargetAtTime(on?0.32:0,AU.ctx.currentTime,0.1); const b=document.getElementById('bMusic'); if(b) b.textContent='MUSIC: '+(on?'ON':'OFF'); }
// ================= DATA =================
const W=1280,H=720,GROUND=640,GW=64,GT=455;

const SAVE_KEY='slimeSoccerBHS_v1';
function newPlayerSave(){ return {coins:200,chars:{classic:1,fireball:1},up:{},cos:{hat:{none:1},face:{none:1},body:{none:1},trail:{none:1},ball:{classic:1},goal:{confetti:1}},eq:{hat:'none',face:'none',body:'none',trail:'none',ball:'classic',goal:'confetti'},char:'classic'}; }
let SAVE;
function loadSave(){
 try{ SAVE=JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){ SAVE=null; }
 if(!SAVE||!SAVE.p) SAVE={p:[newPlayerSave(),newPlayerSave()],music:true,len:0,diff:1,map:'lobby'};
 SAVE.p.forEach((p,i)=>{ const d=newPlayerSave(); for(const k in d) if(p[k]===undefined) p[k]=d[k]; for(const s in d.cos) if(!p.cos[s]) p.cos[s]=d.cos[s]; for(const s in d.eq) if(!p.eq[s]) p.eq[s]=d.eq[s]; });
 if(SAVE.p[1].char==='classic'&&!SAVE.p[1]._init){ SAVE.p[1].char='fireball'; SAVE.p[1]._init=1; }
}
function save(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(SAVE)); }catch(e){} }

const TAU=Math.PI*2;
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function shade(hex,amt){ let c=hex.replace('#',''); if(c.length===3) c=c.split('').map(x=>x+x).join(''); let n=parseInt(c,16),r=(n>>16)+amt,gg=((n>>8)&255)+amt,b=(n&255)+amt; r=Math.max(0,Math.min(255,r)); gg=Math.max(0,Math.min(255,gg)); b=Math.max(0,Math.min(255,b)); return 'rgb('+r+','+gg+','+b+')'; }

 g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill(); g.strokeStyle='#a87400'; g.lineWidth=Math.max(1,r*.12); g.stroke();
 g.strokeStyle='#ffe58a'; g.lineWidth=Math.max(1,r*.12); g.beginPath(); g.arc(x,y,r*.62,0,TAU); g.stroke();

}

function circleRect(b,x,y,w,h,e){
 const cx=clamp(b.x,x,x+w), cy=clamp(b.y,y,y+h); let dx=b.x-cx, dy=b.y-cy; const d2=dx*dx+dy*dy;

  const l=b.x-x, r=x+w-b.x, t=b.y-y, bo=y+h-b.y, m=Math.min(l,r,t,bo);
  if(m===l){ b.x=x-b.r; b.vx=-Math.abs(b.vx)*e; } else if(m===r){ b.x=x+w+b.r; b.vx=Math.abs(b.vx)*e; } else if(m===t){ b.y=y-b.r; b.vy=-Math.abs(b.vy)*e; } else { b.y=y+h+b.r; b.vy=Math.abs(b.vy)*e; }
  return true; }
 const d=Math.sqrt(d2), nx=dx/d, ny=dy/d; b.x=cx+nx*b.r; b.y=cy+ny*b.r; const vn=b.vx*nx+b.vy*ny; if(vn<0){ b.vx-=(1+e)*vn*nx; b.vy-=(1+e)*vn*ny; } return true;
}

function ballVsSlime(b,s,e){
 const sy=s.sy||1; const dx=b.x-s.x, dy=(b.y-s.y)/sy; if(b.y>s.y+b.r) return false;
 let d=Math.hypot(dx,dy); const R=s.r+b.r; if(d>=R) return false;
 if(b.y>s.y){ // below base level: side push
  if(Math.abs(dx)<s.r+b.r){ b.x=s.x+Math.sign(dx||1)*(s.r+b.r); const rv=b.vx-(s.vx||0); if(rv*Math.sign(dx||1)<0) b.vx=(s.vx||0)-rv*e; return true; } return false; }
 if(d===0) d=0.01; let nx=dx/d, ny=dy/d; b.x=s.x+nx*R; b.y=s.y+ny*R*sy;

 if(G.map==='lava'){ if(gm.t<=0){ gm.t=rnd(7,11); const x=rnd(GW+150,W-GW-150); ent({type:'geyser',x,life:2.2,
   update(dt){ if(this.t<0.9){ if(Math.random()<.4) part(this.x+rnd(-30,30),GROUND,{vy:-rnd(60,160),col:'#ff6a1f',size:5,life:.5,max:.5}); return; } if(!this.s){ this.s=1; SFX.boom(); }
    const b=G.ball; if(Math.abs(b.x-this.x)<45&&b.y>GROUND-420) b.vy=Math.min(b.vy,-800); for(const p of G.players) if(Math.abs(p.x-this.x)<40+p.r*0.4&&p.grounded){ p.vy=-900; p.grounded=false; }
    for(let i=0;i<3;i++) part(this.x+rnd(-15,15),GROUND-30,{vx:rnd(-120,120),vy:-rnd(500,900),grav:1000,col:Math.random()<.5?'#ff5a1f':'#ffd23a',size:rnd(4,9),life:.9,max:.9}); },
   draw(g){ if(this.t<0.9){ g.fillStyle='rgba(255,90,31,'+(0.4+0.4*Math.sin(this.t*30))+')'; g.beginPath(); g.ellipse(this.x,GROUND+2,50,8,0,0,TAU); g.fill(); return; } g.fillStyle='rgba(255,110,30,.85)'; const ww=28+Math.sin(this.t*40)*5; g.fillRect(this.x-ww,GROUND-420,ww*2,420); } }); } }
 if(G.map==='beach'){ if(gm.windT>0) gm.windT-=dt; if(gm.t<=0){ gm.t=rnd(8,12); gm.windT=3; gm.wind=(Math.random()<.5?-1:1)*320; popText(640,180,'WIND GUST','#fff',30); SFX.whoosh(); } if(gm.windT>0&&Math.random()<.6) part(gm.wind>0?0:W,rnd(80,600),{type:'l',col:'rgba(255,255,255,.6)',vx:gm.wind*4,size:40,life:.5,max:.5,drag:1}); }
 if(G.map==='park'&&gm.t<=0){ gm.t=rnd(6,10); const d=Math.random()<.5?1:-1; ent({type:'bird',x:d>0?-40:W+40,d,y:rnd(80,220),life:5,update(dt){ this.x+=this.d*200*dt; },draw(g){ g.strokeStyle='#333'; g.lineWidth=3; const f=Math.sin(this.t*14)*8; g.beginPath(); g.moveTo(this.x-14,this.y-f); g.quadraticCurveTo(this.x-6,this.y-4,this.x,this.y); g.quadraticCurveTo(this.x+6,this.y-4,this.x+14,this.y-f); g.stroke(); }}); }
}
function step(dt){
 G.time+=dt;
 if(G.hitstop>0){ G.hitstop-=dt; return; }
 const sdt=dt*G.slowmo;
 if(G.state==='countdown'){ G.cd-=dt; const c=Math.ceil(G.cd); if(c!==G.lastCd&&G.mode!=='demo'){ G.lastCd=c; if(c>0) SFX.countdown(false); else SFX.countdown(true); } if(G.cd<=0){ G.state='play'; } }
 for(const p of G.players) readInput(p);
 const ts=G.timeStop; if(ts){ ts.t-=dt; if(ts.t<=0){ G.timeStop=null; SFX.whoosh(); } }
 const tsA=G.timeStop; // time dome: only things inside the dome around Time Keeper are frozen
 for(const p of G.players){ if(tsA&&tsA.owner!==p.i&&inDome(p.x,p.y-p.r*0.5)){ p.domeFrozen=true; continue; } p.domeFrozen=false; updatePlayer(p,sdt); }
 // slime-slime push
 const a=G.players[0], bb=G.players[1]; const dx=bb.x-a.x; const ov=a.r*0.85+bb.r*0.85-Math.abs(dx); if(ov>0&&Math.abs(a.y-bb.y)<Math.min(a.r,bb.r)){ const s=Math.sign(dx)||1; if(a.domeFrozen) bb.x+=s*ov; else if(bb.domeFrozen) a.x-=s*ov; else { a.x-=s*ov/2; bb.x+=s*ov/2; } }
 for(const q of G.players){ q.x=clamp(q.x,q.r*0.6,W-q.r*0.6); if(q.y>GROUND) q.y=GROUND; }
 const B=G.ball;
 if(tsA&&!B.held&&!B.carried&&inDome(B.x,B.y)){ // frozen ball: keeps any hits from Time Keeper and releases them when time resumes
  if(!B.domeFrozen){ B.domeFrozen=true; B.dsv=[B.vx,B.vy]; }
  const p=G.players[tsA.owner]; B.vx=B.dsv[0]; B.vy=B.dsv[1]; const hx=B.x, hy=B.y; if(ballVsSlime(B,p,0.8)){ B.last=p.i; B.dsv=[B.vx,B.vy]; B.x=hx; B.y=hy; if(Math.hypot(B.x-p.x,B.y-(p.y-p.r*p.sy*0.5))<p.r*p.sy*0.5+B.r) {} } B.vx=0; B.vy=0;
 } else { if(B.domeFrozen){ B.domeFrozen=false; B.vx=B.dsv[0]; B.vy=B.dsv[1]; } if(G.state!=='countdown') updateBall(sdt); }
 for(const e of G.ents){ e.t+=sdt; if(e.update&&!e.dead) e.update(sdt); if(e.t>=e.life) e.dead=true; }
 G.ents=G.ents.filter(e=>!e.dead);
 if(G.bball>0) G.bball-=sdt; for(let i=0;i<2;i++) if(G.rink[i]>0) G.rink[i]-=sdt;
 for(const s of G.splats) s.t+=dt; G.splats=G.splats.filter(s=>s.t<s.life);
 if(G.state==='play'){ updateGimmick(sdt); checkGoal(); if(G.len&&!G.golden&&G.state==='play'){ G.clock-=dt; if(G.clock<=0){ G.clock=0; if(G.score[0]!==G.score[1]) endMatch(G.score[0]>G.score[1]?0:1); else { G.golden=true; G.msg={text:'GOLDEN GOAL',t:2,col:'#ffd23a'}; SFX.whistle(); } } } }
 if(G.state==='goal'){ G.goalT-=dt; G.slowmo=Math.min(1,G.slowmo+dt*0.6); if(G.goalT<=0){ const target=5; const s=G.lastScorer; if(G.mode!=='demo'&&((!G.len&&G.score[s]>=target)||(G.len&&(G.golden)))) endMatch(s); else { if(G.mode==='demo'&&Math.max(...G.score)>=5) G.score=[0,0]; resetKickoff(1-s); G.state='countdown'; G.cd=G.mode==='demo'?0.5:1.5; G.lastCd=3; G.slowmo=1; } } }
 if(G.state==='over'){ G.overT+=dt; const w=G.players[G.winner]; if(w.grounded&&Math.random()<0.05) { w.vy=-700; w.grounded=false; } if(Math.random()<0.2) burst(rnd(0,W),rnd(0,300),8,['#ff3b5c','#ffd23a','#29d17a','#3fa9ff'],200); }
 // particles
 for(const q of G.parts){ q.life-=dt; q.vy+=q.grav*dt; q.vx*=q.drag; q.vy*=q.drag; q.x+=q.vx*dt; q.y+=q.vy*dt; q.rot+=q.vr*dt; }
 G.parts=G.parts.filter(q=>q.life>0);
 if(G.shake>0) G.shake=Math.max(0,G.shake-dt*60);
 if(G.msg){ G.msg.t-=dt; if(G.msg.t<=0) G.msg=null; }
 if(G.flash>0) G.flash-=dt;
}
function endMatch(w){
 G.state='over'; G.winner=w; G.overT=0; SFX.cheer(); SFX.goal(); G.msg={text:(G.mode==='bot'&&w===1?'BOT':'PLAYER '+(w+1))+' WINS',t:99,col:w?'#59b7ff':'#7dff6a'};
 const mult=G.mode==='bot'?[1,1.5,2.2][G.diff]:1;
 for(let i=0;i<2;i++){ if(G.players[i].bot) continue; const c=Math.round((i===w?100:30)*mult); SAVE.p[i].coins+=c; G.earned[i]+=c; }
 save(); setTimeout(()=>{ SFX.coin(); showResult(); },2600);
}

 const gr=$('#shopGrid'); gr.innerHTML=''; const sp=SAVE.p[UI.shopP];
 const card=(img,name,sub,html,tag,cls)=>{ const d=document.createElement('div'); d.className='card'+(cls||''); d.innerHTML=(tag?'<span class="tag'+(tag==='TEACHER'?' t':'')+'">'+tag+'</span>':'')+'<img src="'+img+'"><div class="nm">'+name+'</div><div class="ab">'+sub+'</div>'; const w=document.createElement('div'); if(typeof html==='string') w.innerHTML=html; else w.appendChild(html); d.appendChild(w); gr.appendChild(d); return d; };
 const btn=(txt,cls,fn,dis)=>{ const b=document.createElement('button'); b.className=cls||''; b.innerHTML=txt; b.onclick=fn; if(dis) b.disabled=true; return b; };
 if(UI.tab==='chars'){
  for(const c of CHARS){ const owned=!!sp.chars[c.id];
   const b=owned?btn(sp.char===c.id?'SELECTED':'SELECT','green',()=>{ sp.char=c.id; save(); renderShop(); SFX.pop(); },sp.char===c.id):btn('<i class="coin"></i>'+c.price,'gold',()=>buy(c.price,s=>{ s.chars[c.id]=1; s.char=c.id; }));
   b.dataset.buy=c.id; card(charImg(c.id,sp.eq),c.name,c.ab[0].n,b,c.legend?'LEGENDARY':c.teacher?'TEACHER':''); }
 } else if(UI.tab==='upg'){
  for(const c of CHARS){ const owned=!!sp.chars[c.id]; const lv=sp.up[c.id]||0; const names=UPG[c.id];
   let b; if(!owned) b=btn('LOCKED','grey',()=>{},true); else if(lv>=2) b=btn('MAX','grey',()=>{},true); else { const pr=UPG_PRICE[lv]; b=btn('<i class="coin"></i>'+pr,'gold',()=>buy(pr,s=>{ s.up[c.id]=lv+1; })); b.dataset.upg=c.id; }
   const stars='LV '+(lv+1)+' / 3';
   card(charImg(c.id,{}),c.name,stars+'<br>'+(lv<2?'Next: '+names[lv]:'Maxed: '+names[1])+'<br>Upgrades '+c.ab[0].n,b,'',owned?'':' locked'); }
 } else {
  const items=COS.filter(x=>x[0]===UI.tab);
  for(const it of items){ const [slot,id,nm,pr,tag]=it; const owned=!!(sp.cos[slot]&&sp.cos[slot][id]); const eqd=sp.eq[slot]===id;
   let img;
   if(slot==='ball') img=prevBall(id); else if(slot==='goal') img=prevGoal(id); else if(slot==='trail') img=prevTrail(id); else { const eq=Object.assign({},{hat:'none',face:'none',body:'none'}); eq[slot]=id; img=charImg('classic',eq); }
   const b=owned?btn(eqd?'EQUIPPED':'EQUIP','green',()=>{ sp.eq[slot]=id; save(); renderShop(); SFX.pop(); },eqd):btn('<i class="coin"></i>'+pr,'gold',()=>buy(pr,s=>{ (s.cos[slot]=s.cos[slot]||{})[id]=1; s.eq[slot]=id; }));
   b.dataset.cos=id; card(img,nm,owned?'Owned':'',b,tag||''); }
 }
}
function prevBall(id){ const k='ball_'+id; if(prevCache[k]) return prevCache[k]; const c=document.createElement('canvas'); c.width=140; c.height=100; const x=c.getContext('2d'); x.fillStyle='#22222b'; x.fillRect(0,0,140,100); drawBall(x,70,50,32,0.3,id,1); return prevCache[k]=c.toDataURL(); }
function prevGoal(id){ const k='goal_'+id; if(prevCache[k]) return prevCache[k]; const c=document.createElement('canvas'); c.width=140; c.height=100; const x=c.getContext('2d'); x.fillStyle='#22222b'; x.fillRect(0,0,140,100);
 const cols=['#ff3b5c','#ffd23a','#29d17a','#3fa9ff','#c34bff'];
 if(id==='coins'){ for(let i=0;i<12;i++) drawCoin(x,10+(i*37)%120,10+(i*23)%80,8); }
 else if(id==='wolf'){ wolfHead(x,70,52,1.1); }
 else if(id==='hearts'){ x.fillStyle='#ff3b7a'; for(let i=0;i<8;i++) drawHeart(x,15+(i*41)%110,15+(i*29)%70,9); }
 else if(id==='lightning'){ x.strokeStyle='#fff'; x.shadowColor='#7ad7ff'; x.shadowBlur=10; x.lineWidth=4; x.beginPath(); x.moveTo(70,0); x.lineTo(55,40); x.lineTo(80,45); x.lineTo(60,100); x.stroke(); }
 else if(id==='nuke'){ const rg=x.createRadialGradient(70,50,2,70,50,50); rg.addColorStop(0,'#fff'); rg.addColorStop(.4,'#ffd23a'); rg.addColorStop(1,'rgba(255,90,31,0)'); x.fillStyle=rg; x.fillRect(0,0,140,100); }
 else if(id==='fireworks'){ for(let k2=0;k2<3;k2++){ x.strokeStyle=cols[k2]; x.lineWidth=2; const cx=30+k2*40, cy=30+k2%2*30; for(let i=0;i<12;i++){ const a=i/12*TAU; x.beginPath(); x.moveTo(cx+Math.cos(a)*5,cy+Math.sin(a)*5); x.lineTo(cx+Math.cos(a)*20,cy+Math.sin(a)*20); x.stroke(); } } }
 else { for(let i=0;i<40;i++){ x.fillStyle=cols[i%5]; x.fillRect((i*37)%140,(i*53)%100,7,4); } }
 return prevCache[k]=c.toDataURL(); }
function prevTrail(id){ const k='trail_'+id; if(prevCache[k]) return prevCache[k]; const c=document.createElement('canvas'); c.width=140; c.height=100; const x=c.getContext('2d'); x.fillStyle='#22222b'; x.fillRect(0,0,140,100);
 for(let i=0;i<10;i++){ const px=10+i*8, py=70-Math.sin(i*0.5)*6; const a=i/10; x.globalAlpha=a;
  if(id==='sparkle'){ x.fillStyle='#fff'; drawStar(x,px,py-10+(i%3)*8,4); } else if(id==='fire'){ x.fillStyle=i%2?'#ff5a1f':'#ffd23a'; x.beginPath(); x.arc(px,py,6,0,TAU); x.fill(); } else if(id==='rainbow'){ x.fillStyle='hsl('+i*36+',90%,60%)'; x.beginPath(); x.arc(px,py,7,0,TAU); x.fill(); } else if(id==='bubbles'){ x.strokeStyle='#9fe8ff'; x.lineWidth=2; x.beginPath(); x.arc(px,py-(i%3)*10,5,0,TAU); x.stroke(); } else if(id==='stars'){ x.fillStyle='#ffd23a'; drawStar(x,px,py,6); } else if(id==='bhs'){ x.fillStyle=i%2?'#d0353a':'#111'; x.fillRect(px-4,py-4,8,8); } else if(id==='coins'){ drawCoin(x,px,py,5); } }
 x.globalAlpha=1; x.save(); x.translate(0,-(GROUND-90)); drawSlime(x,108,GROUND,26,1,'classic',{},{t:1,face:1}); x.restore(); return prevCache[k]=c.toDataURL(); }
$('#shopBack').onclick=()=>goMenu();
// ---- pause / result ----
function togglePause(){ if(!G||G.mode==='demo'||G.state==='over') return; UI.paused=!UI.paused; show(UI.paused?'pause':null); }
$('#bResume').onclick=()=>togglePause();
$('#bQuit').onclick=()=>goMenu();
function showResult(){ if(!G||G.state!=='over') return; show('result'); const w=G.winner; $('#resTitle').textContent=(G.mode==='bot'&&w===1?'BOT':'PLAYER '+(w+1))+' WINS'; $('#resTitle').style.color=w?'#59b7ff':'#7dff6a'; $('#resScore').textContent=G.score[0]+' - '+G.score[1];
 $('#resCoins').innerHTML=G.players.filter(p=>!p.bot).map(p=>'<div class="'+(p.i?'p2c':'p1c')+'">P'+(p.i+1)+' +<i class="coin"></i>'+G.earned[p.i]+'</div>').join(''); refreshCoins(); }
$('#bAgain').onclick=()=>{ show(null); startMatch(UI.last); };
$('#bResShop').onclick=()=>openShop();
$('#bResMenu').onclick=()=>goMenu();
// ---- secret button: +1500 coins to both players, only the coin sound ----
$('#secret').addEventListener('click',e=>{ e.stopPropagation(); auInit(); SAVE.p[0].coins+=1500; SAVE.p[1].coins+=1500; save(); SFX.coin(); refreshCoins(); if($('#shop').classList.contains('on')) renderShop(); });
$('#secret2').addEventListener('click',e=>{ e.stopPropagation(); auInit(); SAVE.p[0].coins+=15000; SAVE.p[1].coins+=15000; save(); SFX.coin(); refreshCoins(); if($('#shop').classList.contains('on')) renderShop(); });
// ---- loop ----
let lastT=performance.now(), acc=0; const MENU_EL=document.getElementById('menu'); homeInit();
function loop(now){
 let dt=(now-lastT)/1000; lastT=now; if(dt>0.1) dt=0.1;
 if(MENU_EL.classList.contains('on')){ homeStep(dt); homeDraw(); for(const k in PRESSED) delete PRESSED[k]; requestAnimationFrame(loop); return; }
 if(G&&!UI.paused){ acc+=dt; let n=0; while(acc>=1/60&&n<5){ step(1/60); acc-=1/60; n++; for(const k in PRESSED) delete PRESSED[k]; } if(G.impact>0) G.impact-=dt; }
 else for(const k in PRESSED) delete PRESSED[k];
 render(); requestAnimationFrame(loop);
}
setMusic(SAVE.music!==false); AU.musicOn=SAVE.music!==false;
document.addEventListener('pointerdown',()=>auInit(),{once:false});
goMenu(); requestAnimationFrame(loop);
window.__SS={get G(){return G;},useAbility,startMatch,SAVE:()=>SAVE,step,render,UI};
